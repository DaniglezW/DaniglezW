name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: DaniglezW
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23ff00ff&color_dots=%230d0221,%231a0533,%23331255,%2300ffff,%23ff00ff
            dist/github-contribution-grid-snake.gif?color_snake=%2300ffff&color_dots=%230d0221,%231a0533,%23331255,%23ff00ff,%2300ffff&color_background=%230a0014

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
